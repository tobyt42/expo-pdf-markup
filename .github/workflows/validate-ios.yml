name: Validate iOS

on:
  pull_request:
  workflow_dispatch:
  # Called by release.yml on every push to `main` and on Release tags.
  workflow_call:

permissions:
  contents: read

# Pull requests cancel superseded runs. Every other run (manual dispatch, or a call from
# release.yml) gets its own group, so validation of each push to `main` always completes.
concurrency:
  group: validate-ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xctest:
    name: iOS XCTest
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npm run build
      - name: Generate a clean native example
        run: npx expo prebuild --clean --platform ios --no-install
        working-directory: example
      - name: Wire XCTest sources, PDF fixtures, scheme and CocoaPods target
        run: bundle exec ruby scripts/add_test_target.rb
      - run: bundle exec pod install
        working-directory: example/ios
      - name: Run native XCTest suite
        run: npm run test:swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-test-results
          path: build/test-results
          if-no-files-found: ignore
